<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>반려견 보호자 연결 - 펫넷</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(180deg,#ffffff 0%,#f5f9ff 100%);
    color:#0f2340;
    text-align:center;
}

.wrap{
    max-width:560px;
    margin:0 auto;
    padding:35px 20px;
}

.logo{
    width:250px;
    max-width:85%;
    margin-bottom:20px;
}

.card{
    background:white;
    border-radius:22px;
    padding:30px 22px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h1{
    color:#005bd8;
    font-size:28px;
    margin:10px 0;
}

.desc{
    font-size:17px;
    color:#4d5d73;
    line-height:1.6;
    margin-bottom:25px;
}

.pet-info{
    background:#f5f9ff;
    border:1px solid #d9e8ff;
    border-radius:18px;
    padding:20px;
    text-align:left;
    margin:20px 0;
}

.pet-info p{
    font-size:17px;
    line-height:1.6;
    margin:10px 0;
}

.btn{
    display:block;
    width:100%;
    padding:18px 15px;
    border-radius:14px;
    text-decoration:none;
    font-size:20px;
    font-weight:bold;
    box-sizing:border-box;
    border:none;
    cursor:pointer;
    margin:12px 0;
}

.phone{
    background:#16a34a;
    color:white;
}

.kakao{
    background:#fee500;
    color:#111;
}

.share{
    background:white;
    color:#005bd8;
    border:2px solid #005bd8;
}

.home{
    background:#005bd8;
    color:white;
}

.notice{
    margin-top:22px;
    color:#4d5d73;
    font-size:14px;
    line-height:1.6;
}

.loading{
    color:#4d5d73;
    font-size:17px;
}

@media(max-width:700px){
    .logo{
        width:230px;
    }

    h1{
        font-size:25px;
    }

    .btn{
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="wrap">

    <img src="petnet-logo.png" class="logo" alt="펫넷 로고">

    <div class="card">

        <h1>이 반려견을 발견하셨나요?</h1>

        <div class="desc">
            아래 정보를 확인한 뒤<br>
            보호자에게 바로 연락해주세요.
        </div>

        <div id="loading" class="loading">
            반려견 정보를 불러오는 중...
        </div>

        <div id="content" style="display:none;">

            <div class="pet-info">
                <p id="name"></p>
                <p id="breed"></p>
                <p id="gender"></p>
                <p id="feature"></p>
            </div>

            <a id="phoneLink" class="btn phone" href="#" style="display:none;">
                📞 보호자 전화하기
            </a>

            <a id="kakaoLink" class="btn kakao" href="#" target="_blank" style="display:none;">
                💬 카카오톡 연락하기
            </a>

            <button class="btn share" onclick="copyPageLink()">
                📤 카카오톡 공유하기
            </button>

            <a href="index.html" class="btn home">
                🏠 펫넷 바로가기
            </a>

            <div class="notice">
                🔒 펫넷은 개인정보 노출을 줄이고<br>
                발견자와 보호자를 빠르게 연결합니다.
            </div>

        </div>

    </div>

</div>

<script>
var params = new URLSearchParams(window.location.search);
var petId = params.get("id");

function showPet(data) {
    if (data.error) {
        document.getElementById("loading").innerText = "등록 정보를 찾을 수 없습니다.";
        return;
    }

    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";

    document.getElementById("name").innerHTML = "<b>이름:</b> " + (data.name || "정보 없음");
    document.getElementById("breed").innerHTML = "<b>품종:</b> " + (data.breed || "정보 없음");
    document.getElementById("gender").innerHTML = "<b>성별:</b> " + (data.gender || "정보 없음");
    document.getElementById("feature").innerHTML = "<b>특징:</b> " + (data.feature || "정보 없음");

    if (data.phone) {
        document.getElementById("phoneLink").href = "tel:" + data.phone;
        document.getElementById("phoneLink").style.display = "block";
    }

    if (data.kakao) {
        document.getElementById("kakaoLink").href = data.kakao;
        document.getElementById("kakaoLink").style.display = "block";
    }
}

function copyPageLink(){
    var pageUrl = window.location.href;

    if (navigator.clipboard) {
        navigator.clipboard.writeText(pageUrl).then(function(){
            alert("반려견 페이지 주소가 복사되었습니다. 카카오톡에 붙여넣어 공유할 수 있습니다.");
        });
    } else {
        alert("주소창의 링크를 복사해서 카카오톡에 공유해주세요.");
    }
}

var script = document.createElement("script");
script.src = "https://script.google.com/macros/s/AKfycbxxS-o0PaeURCt_Uj9DnwcjtdBj-3zjFl5dxPWFTwMbQhAyMEnOtmYc9xK57chq5bq3yQ/exec?id=" + petId + "&callback=showPet";
document.body.appendChild(script);
</script>

</body>
</html>
